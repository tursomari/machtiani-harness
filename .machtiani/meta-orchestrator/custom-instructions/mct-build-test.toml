description = "Run build and test:\n\n `cd agent`\n`GOCACHE=$(pwd)/.gocache go build ./...`\n`GOCACHE=$(pwd)/.gocache go test ./...`.\n\nDo not run any `run-live` or `undici` related tests that require network access. Don't go off on a tangent. Run builds and tests as instructed and don't set any timeouts."
