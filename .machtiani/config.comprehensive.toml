# Machtiani Configuration Example
# Copy to .machtiani/config.toml or set MACHTIANI_CONFIG to this file's path.
# Every section and field is documented below. Omit sections you don't need.
#
# VALIDATION GAPS:
# The 'mct-agent config check' command validates only:
#   - default_model is non-empty
#   - default_model resolves to a key in [models]
#
# NOT validated (causes runtime errors if misconfigured):
#   - Model 'provider' references an existing [providers] key
#   - Provider 'base_url' is set and non-empty
#   - Environment 'type' is a known value ("local" or "docker")
#   - Mode 'instruction_file' paths exist on disk
#   - Prompt template file paths are reachable
#   - [environment] 'image' field is rejected at parse time
#   - [[tasks]] arrays in mode TOML are rejected at parse time
# default_model is the model alias used when --model is not specified.
# This alias must exist under [models] below.
default_model = "foo"

# ── [planner] ──────────────────────────────────────────────────────────────────
# Configuration for the orchestration planner.

[planner]
# max_turns is the default maximum number of orchestration turns.
max_turns = 150

# Prompt templates (override defaults by setting any of these):
# system_template = "You are the planning layer for the Machtiani shell agent."
# instance_template = "Task: {{.Task}}"
# timeout_template = "The operation timed out."
# format_error_template = "Your response did not include a properly formatted bash command. Please respond with exactly one fenced bash command using triple backticks with bash language tag."
# ask_prompt = "..."
# plan_system_prompt = "..."
# plan_prompt = "..."
# plan_patch_rules = "..."
# plan_patch_strict_rules = "..."
# plan_patch_enabled_intro = "..."
# plan_patch_disabled_intro = "..."
# finalize_prompt = "..."
# review_prompt = "..."

# ── [shell-agent] ──────────────────────────────────────────────────────────────
# Configuration for the shell-agent subprocess.
# [LEGACY ALIAS] This section can also be named [agent] for backward compatibility.

[shell-agent]
# max_steps caps the number of shell-agent steps per shell-agent invocation.
max_steps = 110
# finalize_remaining_steps: when set, finalize after this many remaining steps.
finalize_remaining_steps = 1  # Inject a "wrap up now" prompt once remaining LLM calls (max_steps - calls so far) drop to this value or below, giving the model a chance to produce a final answer before the hard max_steps cap.

# Prompt templates (override defaults):
# system_template = "..."
# instance_template = "..."
# timeout_template = "..."
# format_error_template = "..."
# action_observation_template = "..."
# lightweight_system_template = "..."
# lightweight_intent_template = "..."
# lightweight_error_template = "..."

# ── [environment] ──────────────────────────────────────────────────────────────
# Shell execution environment settings.

[environment]
# type: "local" (default) or "docker".
type = "local"
# timeout: per-command timeout in seconds.
command_timeout = 30
# cwd: working directory for subprocesses (default: ".").
cwd = "."

# ── [ui] ────────────────────────────────────────────────────────────────────────
# Human-facing terminal presentation. MACHTIANI_THEME overrides this value.
[ui]
# terminal uses the terminal's ANSI palette. Exact branded profiles use
# truecolor when available and fall back to semantic ANSI colors otherwise.
# Valid: terminal, machtiani-dark, machtiani-light, none.
theme = "terminal"
# ── [providers] ─────────────────────────────────────────────────────────────────
# Each provider defines an API endpoint. Models reference a provider by name.

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"

# api_key: set directly or use ${ENV_VAR} references. Prefer environment variables
# (OPENROUTER_API_KEY) or the --api-key CLI flag for secrets.
api_key = "${OPENROUTER_API_KEY}"

# [providers.openai]
# base_url = "https://api.openai.com/v1"
# api_key = "${OPENAI_API_KEY}"
# endpoint = "/chat/completions"

# [providers.custom]
# base_url = "https://my-llm.example.com/v1"
# api_key = "${CUSTOM_API_KEY}"
# [providers.custom.headers]
#   X-Custom-Header = "value"
# [providers.custom.query]
#   api-version = "2024-01-01"

# ── [models] ────────────────────────────────────────────────────────────────────
# Each model alias maps to a provider and an upstream model identifier.
# Note: model 'provider' must reference a [providers] key (this is NOT validated by config check).

[models.foo]
provider = "openrouter"
model    = "openai/gpt-5-nano"

# Prompt caching (per model, optional):
# [models.haiku]
# provider = "openrouter"
# model = "anthropic/claude-haiku-4.5"
# cache_key_name = "cache_control"
# cache_control = { type = "ephemeral" }
# cache_trigger_threshold = 4096
# cache_lookback_offset = 1
#
# Anchor rotation (optional, disabled when 0 or unset):
# cache_reanchor_tokens = 4096
# cache_reanchor_messages = 20
# cache_reanchor_min_cached_tokens = 2048

# Extra request parameters:
# [models.foo.params]
# temperature = 0.7
# max_tokens = 4096

# ── [mode] ──────────────────────────────────────────────────────────────────────
# Configuration for the mode system that supervises multi-step work.
# REJECTED: [[tasks]] arrays are not supported. Use flat single-task TOML schema.

[mode]
# instruction_dir: override directory for custom instructions.
# instruction_dir = ".machtiani/modes/custom-instructions"

# Per-mode instruction file overrides:
# [mode.modes.code]
# instruction_file = "code/tasks.toml"
# [mode.modes.research]
# instruction_file = "research/tasks.toml"

# ── [prompts] ───────────────────────────────────────────────────────────────────
# Override prompt templates with inline string values. Uncomment and customize
# any of the examples below for global overrides.

# [prompts.planner]
# # Override the plan system prompt to inject domain-specific context
# # (e.g., project architecture rules, coding conventions, or business logic).
# plan_system_prompt = "You are an expert planner for a Go microservice codebase.
#   Always prefer standard library over third-party dependencies. All HTTP handlers
#   must include request validation and structured error responses."
#
# # Or load the prompt from a template file instead of inlining the string:
# # plan_system_prompt = { file = "prompts/planner-system.txt" }

# [prompts.shell-agent]
# # Override the format-error template to customize how malformed shell-agent
# # responses are reported back to the model for correction.
# format_error_template = "Your response did not include a properly formatted bash command. Please respond with exactly one fenced bash command using triple backticks with bash language tag."
#
# # Or load the template from a file instead of inlining the string:
# # format_error_template = { file = "prompts/shell-format-error.txt" }

# [prompts.mct]
# # Override the patch-success note appended after a successful patch application
# # to confirm the edit was applied and remind the agent to continue.
# patch_success_note = "Patch applied successfully. Continue with the next step
#   and verify the changes if needed."
#
# # Or load the note from a file instead of inlining the string:
# # patch_success_note = { file = "prompts/patch-success-note.txt" }


# ── Runtime dependencies ────────────────────────────────────────────────────────
# The following tools must be on PATH for mct-agent to function:
#   - git   (required for repo operations, README sync, and snapshots)
#   - rg    (ripgrep; required for file-discovery)
#   - sed   (used by shell-agent for inline edits)
#   - bash  (required for install.sh and test harnesses)
#   - go    (Go 1.23+; required for building from source)
#
# install.sh checks: go, git, rg (bash and sed are NOT checked at install time)
