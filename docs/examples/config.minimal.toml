# Minimal Machtiani configuration — enough to get started.
# Prefer `mct-agent init` and `mct-agent config` for normal setup.
# To use this example directly, pass `--path docs/examples/config.minimal.toml`
# to a config inspection command or copy it to the selected global/UUID config.
# For every section and field, see config.comprehensive.toml.

default_model = "default"

[planner]
max_turns = 150
# turn_timeout = 120  # seconds per turn; 0 = unlimited (default: 120)

# Uncomment to enable shell-agent by default
# shell_agent_enabled = false

[shell-agent]
finalize_remaining_steps = 10
max_steps = 110

[model_defaults]
context_length = 128000 # total input + output tokens; models may override

[providers.default]
base_url = "https://api.example.com/v1"
api_key = "<your-api-key>"

[models.default]
provider = "default"
model = "<your-model>"

[models.default.params.reasoning]
effort = "medium"

[environment]
type = "local"
command_timeout = 9999
cwd = "."

[ui]
# terminal | machtiani-dark | machtiani-light | none
theme = "terminal"

# Optional behavioral settings (all default to what is shown):
# verbose = false
# persist_tmp_data = false
# dry_run = false
# answer_model = ""
# file_discovery_model = ""
# shell_agent_model = ""
# answer_tag = "answer"
# tag = ""
# enable_tag_format = false
